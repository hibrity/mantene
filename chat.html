<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repairge - Chat Interno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-track {
      background: #eef2f7;
    }
  </style>
</head>
<body class="bg-[#f3f4f6] text-slate-700">

  <div class="min-h-screen flex">

    <!-- Sidebar Desktop -->
    <aside class="hidden md:flex w-[260px] bg-[#f5f7fb] border-r border-slate-200 flex-col min-h-screen">
      <div class="h-16 px-5 flex items-center justify-between border-b border-slate-200">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl border border-sky-200 bg-white flex items-center justify-center text-sky-400 text-lg shadow-sm">
            🏷️
          </div>
          <span class="text-xl font-bold text-slate-700">Repairge</span>
        </div>
      </div>

      <div class="px-5 py-4 border-b border-slate-200">
        <p class="text-sm font-semibold text-slate-700 leading-7">
          Administrador (Acesso Livre)<br />
          (Empresa)
        </p>
      </div>

      <nav class="flex-1 px-2 py-3 overflow-y-auto">
        <a href="dashboard.html" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">
          <span>⬚</span>
          <span>Painel Principal</span>
        </a>

        <a href="chat.html" class="mt-1 flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium bg-sky-100 text-sky-600">
          <span>💬</span>
          <span>Chat Interno</span>
        </a>

        <a href="mensagens-apagadas.html" class="mt-1 flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">
          <span>🗑️</span>
          <span>Mensagens Apagadas</span>
        </a>

        <a href="usuarios.html" class="mt-1 flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">
          <span>👥</span>
          <span>Usuários</span>
        </a>

        <a href="tickets.html" class="mt-1 flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">
          <span>🎫</span>
          <span>Tickets</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <div class="flex-1 min-w-0 flex flex-col">

      <!-- Header -->
      <header class="h-16 bg-[#f8fafc] border-b border-slate-200 px-4 md:px-6 flex items-center justify-between">
        <div>
          <p class="text-sm text-slate-400">Comunicação interna</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-sky-200 text-sky-700 font-semibold flex items-center justify-center text-sm">
            AD
          </div>
        </div>
      </header>

      <!-- Chat -->
      <main class="flex-1 flex overflow-hidden">

        <!-- Contacts -->
        <aside class="w-full md:w-[340px] border-r border-slate-200 bg-white flex flex-col">

          <div class="p-4 border-b border-slate-200">
            <h1 class="text-xl font-bold text-slate-700">
              Chat Interno
            </h1>
            <p class="text-sm text-slate-400 mt-1">
              Conversas da empresa
            </p>

            <div class="mt-4">
              <input
                type="text"
                id="searchUserInput"
                placeholder="Buscar usuário..."
                class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-200"
              />
            </div>
          </div>

          <div id="usersList" class="flex-1 overflow-y-auto">
            <div class="p-6 text-center text-sm text-slate-400">
              Carregando usuários...
            </div>
          </div>
        </aside>

        <!-- Conversation -->
        <section class="hidden md:flex flex-1 flex-col bg-[#f8fafc]">

          <!-- Conversation Header -->
          <div id="conversationHeader" class="h-20 border-b border-slate-200 bg-white px-6 flex items-center">
            <div class="text-slate-400 text-sm">
              Selecione um usuário para iniciar a conversa
            </div>
          </div>

          <!-- Messages -->
          <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
            <div class="h-full flex items-center justify-center text-slate-400 text-sm">
              Nenhuma conversa selecionada
            </div>
          </div>

          <!-- Input -->
          <div class="border-t border-slate-200 bg-white p-4">
            <form id="messageForm" class="flex gap-3">
              <input
                type="text"
                id="messageInput"
                placeholder="Digite uma mensagem..."
                class="flex-1 rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-200"
                disabled
              />

              <button
                type="submit"
                id="sendBtn"
                class="rounded-xl bg-sky-500 hover:bg-sky-600 px-5 py-3 text-sm font-medium text-white transition disabled:opacity-50 disabled:cursor-not-allowed"
                disabled
              >
                Enviar
              </button>
            </form>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/config.js";
    import {
      collection,
      query,
      where,
      orderBy,
      addDoc,
      getDocs,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const usersList = document.getElementById("usersList");
    const messagesContainer = document.getElementById("messagesContainer");
    const conversationHeader = document.getElementById("conversationHeader");
    const searchUserInput = document.getElementById("searchUserInput");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const currentUser = JSON.parse(localStorage.getItem("repairgeCurrentUser") || "null") || {
      id: "demo-admin",
      name: "Administrador",
      role: "COMPANY",
      companyId: "empresa-demo"
    };

    let users = [];
    let selectedUser = null;
    let unsubscribeMessages = null;

    async function loadUsers() {
      try {
        const usersQuery = query(
          collection(db, "users"),
          where("companyId", "==", currentUser.companyId)
        );

        const snapshot = await getDocs(usersQuery);

        users = snapshot.docs
          .map(doc => ({
            id: doc.id,
            ...doc.data()
          }))
          .filter(user => user.id !== currentUser.id);

        renderUsers(users);
      } catch (error) {
        console.error("Erro ao carregar usuários:", error);
        usersList.innerHTML = `
          <div class="p-6 text-center text-sm text-red-500">
            Erro ao carregar usuários
          </div>
        `;
      }
    }

    function renderUsers(filteredUsers) {
      if (!filteredUsers.length) {
        usersList.innerHTML = `
          <div class="p-6 text-center text-sm text-slate-400">
            Nenhum usuário encontrado
          </div>
        `;
        return;
      }

      usersList.innerHTML = "";

      filteredUsers.forEach(user => {
        const item = document.createElement("button");
        item.className = `
          w-full px-4 py-4 border-b border-slate-100 flex items-center gap-3 text-left hover:bg-slate-50 transition
          ${selectedUser?.id === user.id ? "bg-sky-50" : ""}
        `;

        item.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-sky-100 text-sky-700 font-semibold flex items-center justify-center">
            ${user.name?.substring(0, 2).toUpperCase() || "US"}
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <p class="font-semibold text-slate-700 truncate">
                ${user.name || "Usuário"}
              </p>

              ${
                user.online
                  ? `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>`
                  : `<span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>`
              }
            </div>

            <p class="text-xs text-slate-400 mt-1 truncate">
              ${user.role || "Usuário"}
            </p>
          </div>
        `;

        item.addEventListener("click", () => {
          selectedUser = user;
          renderUsers(filterUsers(searchUserInput.value));
          openConversation(user);
        });

        usersList.appendChild(item);
      });
    }

    function filterUsers(search) {
      const value = search.toLowerCase().trim();

      return users.filter(user =>
        user.name?.toLowerCase().includes(value) ||
        user.role?.toLowerCase().includes(value)
      );
    }

    function generateConversationId(userA, userB) {
      return [userA, userB].sort().join("_");
    }

    function openConversation(user) {
      conversationHeader.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-sky-100 text-sky-700 font-semibold flex items-center justify-center">
            ${user.name?.substring(0, 2).toUpperCase() || "US"}
          </div>

          <div>
            <h2 class="font-semibold text-slate-700">
              ${user.name}
            </h2>
            <p class="text-sm text-slate-400">
              ${user.role || "Usuário"}
            </p>
          </div>
        </div>
      `;

      messageInput.disabled = false;
      sendBtn.disabled = false;

      listenMessages(user);
    }

    function listenMessages(user) {
      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      const conversationId = generateConversationId(currentUser.id, user.id);

      const messagesQuery = query(
        collection(db, "messages"),
        where("conversationId", "==", conversationId),
        orderBy("createdAt", "asc")
      );

      unsubscribeMessages = onSnapshot(messagesQuery, snapshot => {
        const messages = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        renderMessages(messages);
      });
    }

    function renderMessages(messages) {
      if (!messages.length) {
        messagesContainer.innerHTML = `
          <div class="h-full flex items-center justify-center text-slate-400 text-sm">
            Nenhuma mensagem ainda
          </div>
        `;
        return;
      }

      messagesContainer.innerHTML = "";

      messages.forEach(message => {
        const isMine = message.senderId === currentUser.id;

        const messageDate = message.createdAt?.seconds
          ? new Date(message.createdAt.seconds * 1000)
          : new Date();

        const bubble = document.createElement("div");
        bubble.className = `flex ${isMine ? "justify-end" : "justify-start"}`;

        bubble.innerHTML = `
          <div class="max-w-[80%] md:max-w-[65%] rounded-2xl px-4 py-3 shadow-sm ${
            isMine
              ? "bg-sky-500 text-white rounded-br-md"
              : "bg-white border border-slate-200 text-slate-700 rounded-bl-md"
          }">
            ${
              !isMine
                ? `
                  <div class="text-xs font-semibold mb-1 text-sky-600">
                    ${message.senderName || "Usuário"}
                  </div>
                `
                : ""
            }

            <div class="text-sm whitespace-pre-wrap break-words">
              ${message.text || ""}
            </div>

            <div class="text-[11px] mt-2 ${
              isMine ? "text-sky-100" : "text-slate-400"
            }">
              ${messageDate.toLocaleTimeString("pt-BR", {
                hour: "2-digit",
                minute: "2-digit"
              })}
            </div>
          </div>
        `;

        messagesContainer.appendChild(bubble);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    messageForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!selectedUser) return;

      const text = messageInput.value.trim();

      if (!text) return;

      const conversationId = generateConversationId(currentUser.id, selectedUser.id);

      sendBtn.disabled = true;
      sendBtn.textContent = "Enviando...";

      try {
        await addDoc(collection(db, "messages"), {
          companyId: currentUser.companyId,
          conversationId,
          senderId: currentUser.id,
          senderName: currentUser.name,
          receiverId: selectedUser.id,
          receiverName: selectedUser.name,
          text,
          isDeleted: false,
          createdAt: serverTimestamp()
        });

        messageInput.value = "";
      } catch (error) {
        console.error("Erro ao enviar mensagem:", error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Enviar";
      }
    });

    searchUserInput.addEventListener("input", () => {
      renderUsers(filterUsers(searchUserInput.value));
    });

    loadUsers();
  </script>
</body>
</html>
